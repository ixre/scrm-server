# 应用基本配置
App:
  Name: openscrm
  # * 运行环境 DEV,TEST,PROD；开发和测试环境会开放调试API，生产环境请使用PROD；
  Env: DEMO
  # * 应用秘钥 64位，生成命令：openssl rand -base64 64
  Key: AzbkdkkAV6ow17Jcwk7Z+r0q8MwOGm7lV5WXjalow++RLP/AL22+vEfJbEWnDu4Dvgu6Ee8nt4lqsQllhg13Bg==
  # 超级管理员userID
  SuperAdmin:
    - WangQiang
  # 网关签发/校验登录态 JWT 的密钥（≥32字节），生成命令：openssl rand -hex 32
  # 环境变量 CRM_JWT_SECRET 优先于此项
  JWTSecret: ""
  # 网关→core 内部 gRPC 调用签名密钥（≥32字节），两端必须一致，生成命令：openssl rand -hex 32
  # 环境变量 SCRM_INTERNAL_SECRET 优先于此项
  InternalSecret: ""
  # 是否开启Models自动迁移，修改Model定义自动同步PostgreSQL表结构
  AutoMigration: true
  # 启动时同步微信数据
  AutoSyncWeWorkData: true
  # 租户隔离守卫：enforce（默认，拒绝缺少 tenant_id 条件的 CRM 表语句）/ log（仅记录，灰度排查用）
  TenantGuard: enforce
  # 老企微表（customer/staff 等）守卫：log（默认）/ enforce
  LegacyTenantGuard: log

# API服务配置
Server:
  #debug or release
  RunMode: debug
  # 主服务监听Host，使用docker部署时，注意127.0.0.1监听的是虚拟机本地请求，并非宿主机本地请求
  HttpHost: 0.0.0.0
  # 主服务监听端口
  HttpPort: 9001
  # 会话存档服务监听端口
  MsgArchHttpPort: 9003
  ReadTimeout: 60
  WriteTimeout: 60
  # 会话存档服务访问地址
  MsgArchSrvHost: msg-archive-server

# PostgreSQL数据库配置
DB:
  Host: 172.17.0.1
  Port: 5433
  User: root
  Name: scrm
  Password: root123456
  # PostgreSQL sslmode: disable/require/verify-ca/verify-full
  SSLMode: disable
  # 会话时区
  TimeZone: Asia/Shanghai
  # Per-process connection budget. Reserve capacity for all replicas and jobs.
  MaxOpenConns: 25
  MaxIdleConns: 10
  ConnMaxLifetimeSeconds: 1800
  ConnMaxIdleTimeSeconds: 300

# redis服务器配置
Redis:
  Host: 172.17.0.1:6379
  Password: A6UBxB4igUNxPRfx3CpYutH353VYo8Atpc
  DBNumber: 0
  IdleTimeout: 5
  ReadTimeout: 3
  DialTimeout: 5

# 存储配置
Storage:
  # * 存储类型, 可配置aliyun, qcloud；分别对应阿里云OSS, 腾讯云COS
  Type: aliyun
  # * 阿里云OSS相关配置，请使用子账户凭据，且仅授权oss访问权限
  AccessKeyId: todo
  AccessKeySecret: todo
  Endpoint: todo
  Bucket: todo

  # * 腾讯云OSS相关配置，请使用子账户凭据，且仅授权cos访问权限
  SecretID:
  SecretKey:
  BucketURL:

# 企业微信配置
WeWork:
  # * 企业ID，https://work.weixin.qq.com/wework_admin/frame#profile
  ExtCorpID: ww2d3e2957190c6e4c
  # * 企业微信通讯录API Secret https://work.weixin.qq.com/wework_admin/frame#apps/contactsApi
  ContactSecret: todo
  # * 企业微信客户联系API Secret https://work.weixin.qq.com/wework_admin/frame#customer/analysis
  CustomerSecret: todo
  # * 企业自建主应用ID https://work.weixin.qq.com/wework_admin/frame#apps
  MainAgentID: 10004
  # * 企业自建主应用Secret
  MainAgentSecret: todo
  # * 同步通讯录回调地址的token，客户联系共用此配置，https://work.weixin.qq.com/wework_admin/frame#apps/contactsApi，https://work.weixin.qq.com/wework_admin/frame#customer/analysis
  CallbackToken: todo
  # * 同步通讯录回调地址的AesKey, 客户联系共用此配置
  CallbackAesKey: todo
  # * 会话存档服务私钥，企业微信需开通此功能并设置好对应公钥，https://work.weixin.qq.com/wework_admin/frame#financial/corpEncryptData
  PriKeyPath: /conf/private.key

# 延迟队列设置（通常无需改动）
DelayQueue:
  # bucket数量
  BucketSize: 3
  # bucket在redis中的键名, %d必须保留
  BucketName: dq_bucket_%d
  # ready queue在redis中的键名, %s必须保留
  QueueName: dq_queue_%s
  # 调用blpop阻塞超时时间, 单位秒, 必须小于redis.read_timeout, 修改此项, redis.read_timeout需做相应调整
  QueueBlockTimeout: 2

# 服务商配置由运营方提供；租户通过渠道设置中的「服务商授权接入」绑定。
WecomProvider:
  SuiteID: ""
  SuiteSecret: ""
  CallbackToken: ""
  CallbackAESKey: ""
  # 加密回调的接收方标识；留空按 SuiteID 校验。
  ReceiveID: ""
  RedirectURL: "https://your-domain/console/crm/channel-config"
