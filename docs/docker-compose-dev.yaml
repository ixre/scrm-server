# core 开发基础环境：PostgreSQL（含 zhparser 中文分词）+ Redis
#
# 对齐 conf/config.yaml 的本地默认值（DB.User/Password/Name、Redis.Host/Password），
# 启动后直接 `go run .` 即可连上。
#
# 用法：
#   先构建含 zhparser 的 PG 镜像（仅首次或改 Dockerfile 后）：
#     docker build -t scrm-pg-zhparser:16 -f docs/postgres-zhparser.Dockerfile docs/
#   docker compose -f docker-compose-dev.yaml up -d     # 启动
#   docker compose -f docker-compose-dev.yaml down      # 停止（保留数据）
#   docker compose -f docker-compose-dev.yaml down -v   # 停止并清空数据卷
services:
  postgres:
    image: scrm-pg-zhparser:16
    container_name: scrm-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: root123456
      POSTGRES_DB: scrm
      POSTGRES_USER: root
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - scrm-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "root", "-d", "scrm"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scrm-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "123456"]
    ports:
      - "6379:6379"
    volumes:
      - scrm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  scrm-pg-data:
  scrm-redis-data:
