# core 开发基础环境：MySQL + Redis
#
# 对齐 conf/config.yaml 的本地默认值（DB.User/Password/Name、Redis.Host/Password），
# 启动后直接 `go run .` 即可连上。
#
# 用法：
#   docker compose -f docker-compose-dev.yaml up -d     # 启动
#   docker compose -f docker-compose-dev.yaml down      # 停止（保留数据）
#   docker compose -f docker-compose-dev.yaml down -v   # 停止并清空数据卷
services:
  mysql:
    image: mysql:8.0
    container_name: scrm-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: scrm
      MYSQL_USER: scrm
      MYSQL_PASSWORD: "123456"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - scrm-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scrm-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "123456"]
    ports:
      - "6379:6379"
    volumes:
      - scrm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  scrm-mysql-data:
  scrm-redis-data:
