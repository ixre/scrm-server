# core 开发基础环境：PostgreSQL（含 zhparser 中文分词）+ Redis
#
# 对齐 conf/config.yaml 的本地默认值（DB.User/Password/Name、Redis.Host/Password），
# 启动后直接 `go run .` 即可连上。
#
# 镜像：abcfy2/zhparser:18（基于 PostgreSQL 18，预装 zhparser 中文分词扩展）
#   仓库：https://github.com/abcfy2/docker_zhparser
#   Docker Hub：https://hub.docker.com/r/abcfy2/zhparser
#
# 用法：
#   docker compose -f docker-compose-dev.yaml up -d     # 启动
#   docker compose -f docker-compose-dev.yaml down      # 停止（保留数据）
#   rm -rf pg-data redis-data                           # 清空数据（bind mount 不受 down -v 影响）
services:
  postgres:
    image: abcfy2/zhparser:18
    container_name: scrm-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: root123456
      POSTGRES_DB: scrm
      POSTGRES_USER: root
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - ./pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "root", "-d", "scrm"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scrm-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "123456"]
    ports:
      - "6380:6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
